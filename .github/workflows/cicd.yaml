name: EDTEAM FastAPI demo

on:
  push:
    branches:
      - main
      - development
      
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7 # https://github.com/actions/checkout

      - name: install dependencies
        run: 
          pip install -r requirements.txt

      - name: unitests
        run: 
          pytest test/test.py
          
      - name: docker build
        run:
          docker build -t ${{ secrets.DOCKER_USERNAME }}/edteam-fastapi-demo:${{ github.sha }} .

      - name: Login to Docker Hub   # https://github.com/docker/login-action
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker push
        run:
          docker push ${{ secrets.DOCKER_USERNAME }}/edteam-fastapi-demo:${{ github.sha }}